[package]
name = "gnbg-gpu"
version = "0.1.0"
edition = "2021"

[lib]
name = "gnbg_gpu"
crate-type = ["cdylib", "rlib"]

[dependencies]
wgpu = "0.19"
bytemuck = { version = "1.14", features = ["derive"] }
futures = "0.3"
anyhow = "1.0"
thiserror = "1.0"
pollster = "0.3"
env_logger = "0.11"
log = "0.4"
rand = "0.8"
tokio = { version = "1", features = ["full"] }

# Python dependencies only when python feature is enabled
pyo3 = { version = "0.20", features = ["extension-module"], optional = true }
pyo3-asyncio = { version = "0.20", features = ["tokio-runtime"], optional = true }
numpy = { version = "0.20", optional = true }

[[example]]
name = "gpu_integration_demo"
path = "examples/gpu_integration_demo.rs"

[[example]]
name = "multi_objective_demo"
path = "examples/multi_objective_demo.rs"

[dev-dependencies]
approx = "0.5"

[features]
default = []
python = ["pyo3/extension-module", "pyo3-asyncio", "numpy"]